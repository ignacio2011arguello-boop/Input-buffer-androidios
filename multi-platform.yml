name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    # mod.json lists Windows (gd.win) and Android (gd.android). Windows is built
    # as Win64 and Android as Android64 (64-bit only). The package job below
    # merges both into one .geode file with the .dll and the .android64.so.
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          # The bindings repo's main branch is mid-update for a newer GD
          # version and does not build against stable SDK 5.11.2. Pin it to
          # the last commit before the 5.11.2 release, and build the matching
          # Codegen from source. Remove both lines once Geode publishes the
          # next stable release.
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

  package:
    name: Package build
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      # When a version tag (v1.0.2, ...) is pushed, attach the CI-built .geode
      # to that tag's release, creating the release if needed. It never
      # overwrites a file that is already on the release.
      - name: Attach build to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ steps.build.outputs.build-output }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$OUT_DIR"/*.geode --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$OUT_DIR"/*.geode --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # Easy download: on every push to a branch (or a manual run) the merged
      # .geode is also published on the repository's "Releases" page under the
      # tag "latest-build", replacing the previous one. Open Releases and tap
      # the .geode file, no zip to unpack. Never blocks the build if it fails.
      - name: Publish latest build
        if: github.ref_type == 'branch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ steps.build.outputs.build-output }}
        run: |
          gh release delete latest-build --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest-build "$OUT_DIR"/*.geode --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Latest build (Windows + Android 64)" --notes "Built automatically from the latest commit. Download the .geode file below."
